# Профиль Life для скоринга новостности (radar/score).
# Life — общество и городская жизнь: судьбы людей, работа, дом и двор.
# Общество и ЖКХ стоят выше происшествий. Охват важнее скорости: Life пишет о том,
# что обсуждает весь город, а не о том, что всплыло первым.
# Все веса 0..1. Score — взвешенное среднее признаков, веса нормируются на их сумму.
weights:
  topic: 0.35   # насколько тема в духе издания
  geo: 0.15     # насколько место цепляет читателя
  reach: 0.30   # сколько разных каналов написали
  speed: 0.10   # сколько постов за первый час
  media: 0.10   # есть ли фото
topics:
  общество: 1.0
  ЖКХ: 0.9      # вода, свет, мусор касаются каждого
  пожар: 0.7
  ЧС: 0.7
  ДТП: 0.6
  погода: 0.6
default_topic: 0.3
geo:
  промзона: 0.9         # заводы — рабочие места для половины города
  южный район: 0.8      # большой жилой район
  центр: 0.7
  Речная улица: 0.6
  северный въезд: 0.5   # трасса, жилья рядом мало
default_geo: 0.4        # остальные места города — нейтрально
