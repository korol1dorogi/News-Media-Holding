# Профиль Super для скоринга новостности (radar/score).
# Super — светская хроника: звёзды, тусовки, громкие имена.
# В синтетике звёзд нет, поэтому все городские темы честно стоят низко.
# Выше остальных — пожар в торговом центре и события в центре города, где бывают
# публичные люди. Шум при этом всё равно ниже событий за счёт охвата и скорости.
# Все веса 0..1. Score — взвешенное среднее признаков, веса нормируются на их сумму.
weights:
  topic: 0.30   # насколько тема в духе издания
  geo: 0.10     # насколько место цепляет читателя
  reach: 0.30   # сколько разных каналов написали
  speed: 0.15   # сколько постов за первый час
  media: 0.15   # есть ли фото
topics:
  пожар: 0.4
  ЧС: 0.3
  ДТП: 0.3
  общество: 0.3
  погода: 0.2
  ЖКХ: 0.1
default_topic: 0.1
geo:
  центр: 0.6        # рестораны, торговые центры, светская жизнь
  набережная: 0.5   # прогулки и съёмки
default_geo: 0.2
