# Профиль Mash для скоринга новостности (radar/score).
# Mash — быстрые резонансные происшествия: ДТП, пожары, ЧС и погода стоят высоко.
# Скорость распространения и фото важнее охвата: Mash берёт историю первым,
# пока её не разнесли все, и почти всегда с картинкой.
# Все веса 0..1. Score — взвешенное среднее признаков, веса нормируются на их сумму.
weights:
  topic: 0.30   # насколько тема в духе издания
  geo: 0.10     # насколько место цепляет читателя
  reach: 0.15   # сколько разных каналов написали
  speed: 0.25   # сколько постов за первый час
  media: 0.20   # есть ли фото
topics:
  ДТП: 1.0
  пожар: 1.0
  ЧС: 0.9
  погода: 0.7
  общество: 0.4
  ЖКХ: 0.3      # бытовые отключения Mash берёт, только если они резонансные
default_topic: 0.2
geo:
  северный въезд: 0.8   # трасса на въезде: аварии видят все, кто едет в город
  центр: 0.8            # людные места, торговые центры
  Речная улица: 0.7     # пойма реки, там бывают подтопления
default_geo: 0.4        # остальные места города — нейтрально
